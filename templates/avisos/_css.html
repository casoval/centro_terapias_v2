<style>
.av-wrap{max-width:860px;margin:0 auto;padding:16px;font-family:'Inter',system-ui,sans-serif;color:#0f172a}
.av-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.av-h1{margin:0;font-size:22px;font-weight:700}
.av-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:0;background:#4c1d95;color:#fff;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none}
.av-btn:hover{background:#3b0f7a}
.av-btn-sec{background:#f1f5f9;color:#334155;border:1px solid #e2e8f0}
.av-btn-sec:hover{background:#e2e8f0}
.av-btn-danger{background:#b91c1c}.av-btn-danger:hover{background:#991b1b}
.av-btn-sm{min-height:40px;padding:0 12px;font-size:13px}
.av-tabs{display:flex;gap:6px;margin-bottom:12px;border-bottom:1px solid #e2e8f0}
.av-tab{padding:10px 14px;font-size:14px;font-weight:600;color:#475569;border:0;background:none;border-bottom:3px solid transparent;cursor:pointer;min-height:44px}
.av-tab[aria-selected=true]{color:#4c1d95;border-bottom-color:#4c1d95}
.av-card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px;margin-bottom:12px;display:flex;gap:12px;align-items:flex-start}
.av-card.urg{border-left:5px solid #b91c1c}
.av-body{flex:1;min-width:0}
.av-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:#ede9fe;color:#5b21b6;margin-right:6px}
.av-tag.urg{background:#fee2e2;color:#b91c1c}
.av-title{margin:6px 0 2px;font-size:16px;font-weight:700}
.av-msg{margin:4px 0;font-size:14px;line-height:1.5;color:#334155;white-space:pre-line}
.av-meta{font-size:12px;color:#64748b;margin-top:6px}
.av-thumb{width:88px;height:88px;border-radius:10px;object-fit:cover;background:#e2e8f0;flex:none}
.av-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.av-empty{padding:28px 12px;text-align:center;color:#64748b;font-size:14px;background:#fff;border:1px dashed #cbd5e1;border-radius:14px}
.av-ok{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#166534}
.av-field{margin-bottom:14px}
.av-field label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:#334155}
.av-field input[type=text],.av-field input[type=date],.av-field textarea,.av-field select,.av-field input[type=file]{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px;font-family:inherit;background:#fff}
.av-field ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 16px}
.av-field li label{display:inline-flex;align-items:center;gap:6px;font-weight:500;min-height:32px}
.av-help{font-size:12px;color:#64748b;margin-top:3px}
.av-err{font-size:13px;color:#b91c1c;margin-top:3px}
.av-box{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px}
.av-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.av-grid2{grid-template-columns:1fr}.av-thumb{width:64px;height:64px}}
.av-table{width:100%;border-collapse:collapse;font-size:14px}
.av-table th,.av-table td{text-align:left;padding:10px;border-bottom:1px solid #e2e8f0}
</style>
