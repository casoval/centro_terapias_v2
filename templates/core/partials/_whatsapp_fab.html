<!--
    Botón flotante de WhatsApp multi-sede — copia fiel del de core/landing.html
    (mismo CSS, HTML y JS). Se incluye en las páginas de /nuestros-servicios/.
-->
<style>
        /* ─────────────────────────────────────────
           WHATSAPP FLOATING BUTTON (multi-sede)
        ───────────────────────────────────────── */
        .wa-fab-wrapper {
            position: fixed; bottom: 2rem; right: 2rem; z-index: 9999;
            display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
            animation: fabPop 0.5s cubic-bezier(0.34,1.56,0.64,1) both 1.5s;
        }
        @keyframes fabPop {
            from { opacity: 0; transform: scale(0.5) translateY(20px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }
        /* Opciones de sede (ocultas por defecto) */
        .wa-fab-options {
            display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
            opacity: 0; pointer-events: none;
            transform: translateY(12px);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .wa-fab-wrapper.open .wa-fab-options {
            opacity: 1; pointer-events: auto;
            transform: translateY(0);
        }
        .wa-sede-btn {
            display: flex; align-items: center; gap: 10px;
            background: #25D366;
            color: white; font-family: 'Baloo 2', cursive;
            font-size: 0.82rem; font-weight: 800;
            padding: 0.6rem 1.1rem 0.6rem 0.9rem;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 6px 24px rgba(37,211,102,0.45), 0 2px 8px rgba(0,0,0,0.3);
            white-space: nowrap;
            min-width: 190px;
            width: 190px;
            justify-content: flex-start;
            transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
        }
        .wa-sede-btn:hover {
            transform: scale(1.06) translateY(-3px);
            box-shadow: 0 12px 36px rgba(37,211,102,0.55);
        }
        .wa-sede-btn.sucursal {
            background: #128C7E;
        }
        /* Etiqueta de sede */
        .wa-sede-label {
            display: flex; flex-direction: column; line-height: 1.1;
        }
        .wa-sede-label small {
            font-size: 0.65rem; font-weight: 600; opacity: 0.85; letter-spacing: 0.03em;
        }
        /* Botón principal toggle */
        .whatsapp-fab {
            display: flex; align-items: center; gap: 10px;
            background: #25D366;
            color: white; font-family: 'Baloo 2', cursive;
            font-size: 0.85rem; font-weight: 800;
            padding: 0.75rem 1.2rem 0.75rem 1rem;
            border-radius: 50px;
            border: none; cursor: pointer;
            box-shadow: 0 8px 32px rgba(37,211,102,0.45), 0 2px 8px rgba(0,0,0,0.3);
            transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
        }
        .whatsapp-fab:hover {
            transform: scale(1.07) translateY(-4px);
            box-shadow: 0 16px 48px rgba(37,211,102,0.55);
        }
        .whatsapp-fab-label { white-space: nowrap; }
        .wa-fab-wrapper.open .whatsapp-fab {
            background: #128C7E;
        }
        @media (max-width: 480px) {
            .whatsapp-fab-label { display: none; }
            .whatsapp-fab { padding: 0.85rem; border-radius: 50%; }
            .wa-sede-label small { display: none; }
        }


    /* Igual que la landing en móvil: siempre visible y dentro del viewport */
    @media (max-width: 768px) {
        .wa-fab-wrapper {
            right: 0.75rem !important;
            bottom: 0.75rem !important;
            max-width: calc(100vw - 1.5rem) !important;
        }
        .wa-sede-btn {
            min-width: auto !important;
            width: auto !important;
            max-width: calc(100vw - 5rem) !important;
        }
    }
</style>

<div class="wa-fab-wrapper" id="waFabWrapper" style="touch-action:manipulation; will-change:transform;">

<script>
function toggleWaFab() {
    const wrapper = document.getElementById('waFabWrapper');
    const label   = document.getElementById('waFabLabel');
    const toggle  = document.getElementById('waFabToggle');
    const isOpen  = wrapper.classList.toggle('open');
    label.textContent = isOpen ? 'Elegir sede ▲' : '¡Escríbenos!';
    toggle.setAttribute('aria-expanded', String(isOpen));
}
document.addEventListener('click', function(e) {
    const wrapper = document.getElementById('waFabWrapper');
    const toggle  = document.getElementById('waFabToggle');
    if (!wrapper.contains(e.target)) {
        wrapper.classList.remove('open');
        document.getElementById('waFabLabel').textContent = '¡Escríbenos!';
        toggle.setAttribute('aria-expanded', 'false');
    }
});
</script>
