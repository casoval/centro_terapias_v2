{% extends 'base.html' %}
{% block title %}{% block mk_title %}Marketing{% endblock %} · Marketing{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto py-6 px-4">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h1 class="text-xl font-black text-slate-800">📣 Marketing</h1>
        <span class="text-[11px] font-bold text-fuchsia-700 bg-fuchsia-50 border border-fuchsia-200 rounded-full px-3 py-1">Solo superusuario</span>
    </div>

    <nav class="flex flex-wrap gap-1 mb-6 border-b border-slate-200">
        <a href="{% url 'marketing:panel' %}" class="px-4 py-2 text-sm font-bold rounded-t-lg {% if seccion == 'panel' %}text-fuchsia-700 bg-white border border-b-white border-slate-200 -mb-px{% else %}text-slate-500 hover:text-fuchsia-700{% endif %}">📊 Panel</a>
        <a href="{% url 'marketing:campana_lista' %}" class="px-4 py-2 text-sm font-bold rounded-t-lg {% if seccion == 'campanas' %}text-fuchsia-700 bg-white border border-b-white border-slate-200 -mb-px{% else %}text-slate-500 hover:text-fuchsia-700{% endif %}">🎯 Campañas</a>
        <a href="{% url 'marketing:ficha_lista' %}" class="px-4 py-2 text-sm font-bold rounded-t-lg {% if seccion == 'fichas' %}text-fuchsia-700 bg-white border border-b-white border-slate-200 -mb-px{% else %}text-slate-500 hover:text-fuchsia-700{% endif %}">📚 Fichas</a>
        <a href="{% url 'marketing:activo_lista' %}" class="px-4 py-2 text-sm font-bold rounded-t-lg {% if seccion == 'activos' %}text-fuchsia-700 bg-white border border-b-white border-slate-200 -mb-px{% else %}text-slate-500 hover:text-fuchsia-700{% endif %}">🖼️ Activos</a>
        <a href="{% url 'marketing:marca_lista' %}" class="px-4 py-2 text-sm font-bold rounded-t-lg {% if seccion == 'marcas' %}text-fuchsia-700 bg-white border border-b-white border-slate-200 -mb-px{% else %}text-slate-500 hover:text-fuchsia-700{% endif %}">🏷️ Marcas</a>
        <a href="{% url 'marketing:config' %}" class="px-4 py-2 text-sm font-bold rounded-t-lg {% if seccion == 'config' %}text-fuchsia-700 bg-white border border-b-white border-slate-200 -mb-px{% else %}text-slate-500 hover:text-fuchsia-700{% endif %}">⚙️ Configuración</a>
    </nav>

    {% block mk_content %}{% endblock %}
</div>
{% endblock %}
